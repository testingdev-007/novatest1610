<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovaPay — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!--
    ╔══════════════════════════════════════════════════════════════╗
    ║  WEBSITE MAKEOVER — NOVAPAY EDITION                          ║
    ╠══════════════════════════════════════════════════════════════╣
    ║  This page has two kinds of problems:                        ║
    ║                                                              ║
    ║  PART 1 — BUGS: things that are broken or give wrong answers ║
    ║  PART 2 — DESIGN: things that work but are poor choices      ║
    ║           (hard to read, hard to use, hard to reach)         ║
    ║                                                              ║
    ║  Your goal: fix the bugs, then use GitHub Copilot to make    ║
    ║  this the GOLD STANDARD version of a banking dashboard.      ║
    ║                                                              ║
    ║  Everything you need is in THIS file. Nothing is hidden.     ║
    ║  Look for "MAKEOVER?" comments if you get stuck.             ║
    ║                                                              ║
    ║  Tiers:  ★ Easy   ★★ Medium   ★★★ Hard   ✦ Stretch          ║
    ╚══════════════════════════════════════════════════════════════╝
  -->

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #F0F2F8;
      --card:         #FFFFFF;
      --hero-from:    #0F1340;
      --hero-mid:     #1A1560;
      --hero-to:      #2D1B69;
      --accent:       #6C63FF;
      --accent-light: #EEEEFF;
      --text:         #0D0F1C;
      --muted:        #A9AFC0;
      --border:       #E8ECF2;
      --debit:        #FF4757;
      --credit:       #00C896;
      --shadow:       0 2px 12px rgba(13,15,28,0.08);
      --r:            16px;
      --r-sm:         10px;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 48px;
    }

    /* ── HEADER ─────────────────────────────── */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: white;
      border-bottom: 1px solid var(--border);
      height: 60px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .app-logo {
      font-size: 1.2em;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: var(--accent);
    }
    .app-logo span { color: var(--text); }

    .header-actions { display: flex; align-items: center; gap: 10px; }

    /* MAKEOVER? These buttons are small and have no hover or focus style. */
    .icon-btn {
      width: 44px; height: 44px;
      border: none; border-radius: 50%;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.8em;
      cursor: pointer;
    }
    .icon-btn:hover { background: var(--accent-light); }

    .avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: var(--accent);
      color: white;
      font-size: 0.75em;
      font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      letter-spacing: 0;
    }

    /* ── MAIN ───────────────────────────────── */
    .main {
      max-width: 660px;
      margin: 0 auto;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* ── BALANCE HERO ───────────────────────── */
    .balance-hero {
      background: linear-gradient(135deg, var(--hero-from) 0%, var(--hero-mid) 55%, var(--hero-to) 100%);
      border-radius: var(--r);
      padding: 28px 28px 24px;
      color: white;
      position: relative;
      overflow: hidden;
    }

    .balance-hero::before {
      content: '';
      position: absolute; top: -70px; right: -50px;
      width: 220px; height: 220px;
      border-radius: 50%;
      background: rgba(108, 99, 255, 0.18);
      pointer-events: none;
    }
    .balance-hero::after {
      content: '';
      position: absolute; bottom: -90px; left: 30px;
      width: 180px; height: 180px;
      border-radius: 50%;
      background: rgba(108, 99, 255, 0.10);
      pointer-events: none;
    }

    .balance-eyebrow {
      font-size: 0.7em;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.55);
      margin-bottom: 10px;
      position: relative; z-index: 1;
    }

    .balance-amount {
      font-size: 3em;
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
      color: #FFFFFF;
      margin-bottom: 24px;
      font-variant-numeric: tabular-nums;
      position: relative; z-index: 1;
    }

    .balance-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative; z-index: 1;
    }

    .account-name {
      font-size: 0.85em;
      font-weight: 500;
      color: rgba(255,255,255,0.65);
    }

    .account-pill {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 100px;
      padding: 5px 14px;
      font-size: 0.78em;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: rgba(255,255,255,0.85);
    }

    /* ── STATS ROW ──────────────────────────── */
    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .stat-card {
      background: var(--card);
      border-radius: var(--r-sm);
      padding: 16px 18px;
      box-shadow: var(--shadow);
    }

    .stat-label {
      font-size: 0.7em;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 1.2em;
      font-weight: 700;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
    }
    .stat-value.income { color: var(--credit); }
    .stat-value.outgo  { color: var(--debit);  }

    /* ── GENERIC CARD ───────────────────────── */
    .card {
      background: var(--card);
      border-radius: var(--r);
      padding: 22px;
      box-shadow: var(--shadow);
    }

    .card-title {
      font-size: 0.72em;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 16px;
    }

    /* ── TRANSACTIONS ───────────────────────── */
    .tx-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .tx-item:last-child { border-bottom: none; }

    .tx-icon {
      width: 44px; height: 44px;
      border-radius: 12px;
      background: var(--accent-light);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.25em;
      flex-shrink: 0;
    }

    .tx-meta { flex: 1; min-width: 0; }

    .tx-name {
      font-size: 0.92em;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* MAKEOVER? Is this date easy to read? */
    .tx-date {
      font-size: 0.8em;
      color: #6B7186;
      margin-top: 3px;
    }

    .tx-amount {
      font-size: 0.92em;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }
    .tx-amount.debit  { color: var(--debit);  }
    .tx-amount.credit { color: var(--credit); }

    /* ── FORMS ──────────────────────────────── */
    .field { margin-bottom: 14px; }

    .field-label {
      display: block;
      font-size: 0.72em;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 7px;
    }

    .input-wrap { position: relative; }

    .input-prefix {
      position: absolute;
      left: 14px; top: 50%;
      transform: translateY(-50%);
      font-weight: 600;
      color: var(--muted);
      font-size: 0.9em;
      pointer-events: none;
    }

    /* MAKEOVER? Tab through the page with your keyboard. Can you see where you are? */
    input {
      width: 100%;
      padding: 12px 14px 12px 30px;
      border: 2px solid var(--border);
      border-radius: var(--r-sm);
      font-size: 0.95em;
      font-family: inherit;
      color: var(--text);
      background: var(--bg);
    }
    input:focus { border-color: var(--accent); }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

    .btn {
      display: block;
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: var(--r-sm);
      font-size: 0.95em;
      font-family: inherit;
      font-weight: 700;
      letter-spacing: 0.02em;
      background: var(--accent);
      color: white;
      cursor: pointer;
    }
    .btn:hover { filter: brightness(1.1); }

    .btn-ghost {
      background: var(--accent-light);
      color: var(--accent);
    }

    /* ── ALERTS ─────────────────────────────── */
    .alert {
      margin-top: 12px;
      padding: 12px 16px;
      border-radius: var(--r-sm);
      font-size: 0.88em;
      font-weight: 500;
      display: none;
      font-weight: 600;
    }
    .alert-ok  { background: #E6FAF3; color: #00804E; border: 1px solid #B0EDCF; }
    .alert-err { background: #FFF0F1; color: #BF1030; border: 1px solid #FFB8C1; }

    /* ── INTEREST RESULT ────────────────────── */
    .result-box {
      margin-top: 16px;
      background: var(--accent-light);
      border-radius: var(--r-sm);
      padding: 16px 18px;
      display: none;
    }
    .result-eyebrow {
      font-size: 0.68em;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 5px;
    }
    .result-figure {
      font-size: 1.8em;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
    }

    /* ── CALC GRID ─────── */
    /* MAKEOVER? Squash your browser window to phone width. What happens here? */
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 480px) {
      .two-col { grid-template-columns: 1fr; }
      .balance-amount { font-size: 2.2em; }
      .stats-row { grid-template-columns: 1fr; }
      .app-header { padding: 0 12px; }
    }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="app-logo">nova<span>pay</span></div>
    <div class="header-actions">
      <!-- MAKEOVER? What would a screen reader say about these buttons? -->
      <button class="icon-btn" aria-label="Notifications">🔔</button>
      <button class="icon-btn" aria-label="Settings">⚙️</button>
      <div class="avatar" role="img" aria-label="Alex Chen">AC</div>
    </div>
  </header>

  <main class="main">

    <!-- Balance card -->
    <div class="balance-hero">
      <div class="balance-eyebrow">Current Balance</div>
      <div class="balance-amount" id="balance-display" aria-live="polite"></div>
      <div class="balance-footer">
        <div class="account-name">Alex Chen · Current Account</div>
        <div class="account-pill">•••• 4821</div>
      </div>
    </div>

    <!-- Money in / out summary -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">Money In</div>
        <div class="stat-value income" id="stat-in"></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Money Out</div>
        <div class="stat-value outgo" id="stat-out"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Recent Transactions</div>
      <div id="tx-list"></div>
    </div>

    <div class="card">
      <div class="card-title">Withdraw Funds</div>

      <div class="field">
        <label class="field-label" for="withdraw-amount">Amount</label>
        <div class="input-wrap">
          <span class="input-prefix">£</span>
          <input type="text" inputmode="decimal" id="withdraw-amount" placeholder="0.00">
        </div>
      </div>

      <button class="btn" type="button" onclick="makeWithdrawal()">Withdraw</button>

      <!-- MAKEOVER? Do these messages work for someone who can't see colour? -->
      <div class="alert alert-ok" id="wd-success" role="status"></div>
      <div class="alert alert-err" id="wd-error" role="alert"></div>
    </div>

    <div class="card">
      <div class="card-title">Interest Calculator</div>
      <p style="font-size:0.85em;color:var(--muted);margin-bottom:16px;">
        Find out how much your savings could earn over 12 months.
      </p>

      <div class="two-col">
        <div class="field">
          <label class="field-label" for="int-amount">Amount</label>
          <div class="input-wrap">
            <span class="input-prefix">£</span>
            <input type="number" id="int-amount" placeholder="1000" min="0" step="any">
          </div>
        </div>
        <div class="field">
          <label class="field-label" for="int-rate">Interest Rate (% per year)</label>
          <div class="input-wrap">
            <span class="input-prefix">%</span>
            <input type="number" id="int-rate" placeholder="4.5" min="0" step="any">
          </div>
        </div>
      </div>

      <button class="btn btn-ghost" type="button" onclick="calculateInterest()">Calculate</button>

      <div class="result-box" id="int-result-box" role="status">
        <div class="result-eyebrow">Interest earned over 12 months</div>
        <div class="result-figure" id="int-result-figure"></div>
      </div>
    </div>

  </main>

  <script>
    let balance = 1250;

    const gbp = new Intl.NumberFormat('en-GB', { style: 'currency', currency: 'GBP' });
    const fmt = n => gbp.format(n);

    // amount: negative = money out, positive = money in
    const transactions = [
      { icon: '☕', name: 'Costa Coffee — King’s Cross Station', amount: -3.80,   date: new Date('2026-10-18T09:14') },
      { icon: '💷', name: 'Salary — Acme Ltd',                    amount: 2450.00, date: new Date('2026-07-01T08:00') },
      { icon: '🛒', name: 'Tesco Express — Oxford Street',        amount: -14.30,  date: new Date('2026-06-30T18:32') },
      { icon: '🎵', name: 'Spotify — Monthly Subscription',       amount: -9.99,   date: new Date('2026-06-28T00:00') },
      { icon: '📦', name: 'Amazon — Prime Housewares Order',      amount: -28.99,  date: new Date('2026-06-27T14:21') },
    ];

    const round2 = n => Math.round(n * 100) / 100;

    function formatDate(d) {
      const now = new Date();
      const time = d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
      if (d.toDateString() === now.toDateString()) return `Today, ${time}`;
      const opts = { day: 'numeric', month: 'short' };
      if (d.getFullYear() !== now.getFullYear()) opts.year = 'numeric';
      return `${d.toLocaleDateString('en-GB', opts)}, ${time}`;
    }

    function renderTransactions() {
      const list = document.getElementById('tx-list');
      list.innerHTML = '';
      [...transactions]
        .sort((a, b) => b.date - a.date)
        .forEach(t => {
          const isDebit = t.amount < 0;
          const item = document.createElement('div');
          item.className = 'tx-item';
          item.innerHTML = `
            <div class="tx-icon" aria-hidden="true"></div>
            <div class="tx-meta">
              <div class="tx-name"></div>
              <div class="tx-date"></div>
            </div>
            <div class="tx-amount ${isDebit ? 'debit' : 'credit'}"></div>`;
          item.querySelector('.tx-icon').textContent = t.icon;
          item.querySelector('.tx-name').textContent = t.name;
          item.querySelector('.tx-date').textContent = formatDate(t.date);
          item.querySelector('.tx-amount').textContent =
            (isDebit ? '−' : '+') + fmt(Math.abs(t.amount));
          list.appendChild(item);
        });

      const moneyIn  = transactions.filter(t => t.amount > 0).reduce((s, t) => s + t.amount, 0);
      const moneyOut = transactions.filter(t => t.amount < 0).reduce((s, t) => s - t.amount, 0);
      document.getElementById('stat-in').textContent  = '+' + fmt(round2(moneyIn));
      document.getElementById('stat-out').textContent = '−' + fmt(round2(moneyOut));
    }

    function renderBalance() {
      document.getElementById('balance-display').textContent = fmt(balance);
    }

    function makeWithdrawal() {
      const successEl = document.getElementById('wd-success');
      const errorEl   = document.getElementById('wd-error');
      const inputEl   = document.getElementById('withdraw-amount');
      const amount    = round2(parseFloat(inputEl.value));

      successEl.style.display = 'none';
      errorEl.style.display   = 'none';

      if (Number.isNaN(amount) || amount <= 0) {
        errorEl.textContent = '⚠ Error: Please enter a valid withdrawal amount.';
        errorEl.style.display = 'block';
        return;
      }

      if (amount > balance) {
        errorEl.textContent = '⚠ Error: You do not have enough money for that withdrawal.';
        errorEl.style.display = 'block';
        return;
      }

      balance = round2(balance - amount);
      transactions.push({ icon: '↘', name: 'Cash Withdrawal — NovaPay ATM', amount: -amount, date: new Date() });

      renderBalance();
      renderTransactions();

      successEl.textContent = `✔ Success: Withdrawn ${fmt(amount)}. New balance: ${fmt(balance)}`;
      successEl.style.display = 'block';
      inputEl.value = '';
    }

    function calculateInterest() {
      const principal = parseFloat(document.getElementById('int-amount').value);
      const rate      = parseFloat(document.getElementById('int-rate').value);
      const box = document.getElementById('int-result-box');
      const out = document.getElementById('int-result-figure');

      box.style.display = 'block';
      if (Number.isNaN(principal) || Number.isNaN(rate) || principal < 0 || rate < 0) {
        out.textContent = 'Enter a valid amount and rate';
        return;
      }
      // Simple interest over 12 months: rate is a yearly percentage
      out.textContent = fmt(principal * (rate / 100));
    }

    renderBalance();
    renderTransactions();
  </script>

</body>
</html>
