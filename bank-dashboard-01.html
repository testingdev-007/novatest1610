<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovaPay — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg:#F0F2F8; --card:#FFFFFF; --hero-from:#0F1340; --hero-mid:#1A1560; --hero-to:#2D1B69; --accent:#6C63FF; --accent-light:#EEEEFF; --text:#0D0F1C; --muted:#A9AFC0; --border:#E8ECF2; --debit:#FF4757; --credit:#00C896; --shadow:0 2px 12px rgba(13,15,28,0.08); --r:16px; --r-sm:10px; }
    body { font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background:var(--bg); color:var(--text); min-height:100vh; padding-bottom:48px; }
    .app-header { position:sticky; top:0; z-index:100; background:white; border-bottom:1px solid var(--border); height:60px; padding:0 24px; display:flex; align-items:center; justify-content:space-between; }
    .app-logo { font-size:1.2em; font-weight:800; letter-spacing:-0.04em; color:var(--accent); }
    .app-logo span { color:var(--text); }
    .header-actions { display:flex; align-items:center; gap:10px; }
    .icon-btn { width:28px; height:28px; border:none; border-radius:50%; background:var(--bg); display:flex; align-items:center; justify-content:center; font-size:0.8em; cursor:pointer; }
    .avatar { width:36px; height:36px; border-radius:50%; background:var(--accent); color:white; font-size:0.75em; font-weight:700; display:flex; align-items:center; justify-content:center; }
    .main { max-width:660px; margin:0 auto; padding:24px 16px; display:flex; flex-direction:column; gap:14px; }
    .balance-hero { background:linear-gradient(135deg, var(--hero-from) 0%, var(--hero-mid) 55%, var(--hero-to) 100%); border-radius:var(--r); padding:28px 28px 24px; color:white; position:relative; overflow:hidden; }
    .balance-hero::before { content:''; position:absolute; top:-70px; right:-50px; width:220px; height:220px; border-radius:50%; background:rgba(108, 99, 255, 0.18); pointer-events:none; }
    .balance-hero::after { content:''; position:absolute; bottom:-90px; left:30px; width:180px; height:180px; border-radius:50%; background:rgba(108, 99, 255, 0.10); pointer-events:none; }
    .balance-eyebrow { font-size:0.7em; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:rgba(255,255,255,0.55); margin-bottom:10px; position:relative; z-index:1; }
    .balance-amount { font-size:3em; font-weight:800; letter-spacing:-0.04em; line-height:1; color:white; margin-bottom:24px; font-variant-numeric:tabular-nums; position:relative; z-index:1; }
    .balance-footer { display:flex; align-items:center; justify-content:space-between; position:relative; z-index:1; }
    .account-name { font-size:0.85em; font-weight:500; color:rgba(255,255,255,0.65); }
    .account-pill { background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); border-radius:100px; padding:5px 14px; font-size:0.78em; font-weight:600; letter-spacing:0.06em; color:rgba(255,255,255,0.85); }
    .stats-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .stat-card { background:var(--card); border-radius:var(--r-sm); padding:16px 18px; box-shadow:var(--shadow); }
    .stat-label { font-size:0.7em; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
    .stat-value { font-size:1.2em; font-weight:700; letter-spacing:-0.02em; font-variant-numeric:tabular-nums; }
    .stat-value.income { color:var(--credit); }
    .stat-value.outgo { color:var(--debit); }
    .card { background:var(--card); border-radius:var(--r); padding:22px; box-shadow:var(--shadow); }
    .card-title { font-size:0.72em; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); margin-bottom:16px; }
    .tx-item { display:flex; align-items:center; gap:14px; padding:12px 0; border-bottom:1px solid var(--border); }
    .tx-item:last-child { border-bottom:none; }
    .tx-icon { width:44px; height:44px; border-radius:12px; background:var(--accent-light); display:flex; align-items:center; justify-content:center; font-size:1.25em; flex-shrink:0; }
    .tx-meta { flex:1; min-width:0; }
    .tx-name { font-size:0.92em; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .tx-date { font-size:0.65em; color:var(--muted); margin-top:3px; }
    .tx-amount { font-size:0.92em; font-weight:700; font-variant-numeric:tabular-nums; flex-shrink:0; }
    .tx-amount.debit { color:var(--debit); }
    .tx-amount.credit { color:var(--credit); }
    .field { margin-bottom:14px; }
    .field-label { display:block; font-size:0.72em; font-weight:700; letter-spacing:0.07em; text-transform:uppercase; color:var(--muted); margin-bottom:7px; }
    .input-wrap { position:relative; }
    .input-prefix { position:absolute; left:14px; top:50%; transform:translateY(-50%); font-weight:600; color:var(--muted); font-size:0.9em; pointer-events:none; }
    input { width:100%; padding:12px 14px 12px 30px; border:2px solid var(--border); border-radius:var(--r-sm); font-size:0.95em; font-family:inherit; color:var(--text); background:var(--bg); outline:none; }
    input:focus-visible { border-color:var(--accent); box-shadow:0 0 0 3px rgba(108,99,255,0.25); }
    .btn { display:block; width:100%; padding:13px; border:none; border-radius:var(--r-sm); font-size:0.95em; font-family:inherit; font-weight:700; letter-spacing:0.02em; background:var(--accent); color:white; cursor:pointer; }
    .btn:focus-visible, .icon-btn:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
    .btn-ghost { background:var(--accent-light); color:var(--accent); }
    .result-box { margin-top:16px; background:var(--accent-light); border-radius:var(--r-sm); padding:16px 18px; display:none; }
    .result-eyebrow { font-size:0.68em; font-weight:700; letter-spacing:0.09em; text-transform:uppercase; color:var(--accent); margin-bottom:5px; }
    .result-figure { font-size:1.8em; font-weight:800; color:var(--accent); letter-spacing:-0.03em; font-variant-numeric:tabular-nums; }
    .two-col { display:grid; grid-template-columns:1fr 1fr; gap:12px; }

    /* ── TOAST ── */
    .toast-container { position:fixed; top:72px; left:50%; transform:translateX(-50%); z-index:1000; display:flex; flex-direction:column; gap:10px; width:calc(100% - 32px); max-width:420px; pointer-events:none; }
    .toast { display:flex; align-items:center; gap:10px; padding:14px 16px; border-radius:var(--r-sm); font-size:0.9em; font-weight:600; background:var(--text); color:white; box-shadow:0 8px 24px rgba(13,15,28,0.25); border-left:6px solid var(--credit); opacity:0; transform:translateY(-12px); transition:opacity .25s ease, transform .25s ease; }
    .toast.show { opacity:1; transform:translateY(0); }
    .toast.error { border-left-color:var(--debit); }
    .toast-icon { font-size:1.1em; flex-shrink:0; }
    @media (prefers-reduced-motion: reduce) { .toast { transition:none; } }
    @media (max-width:480px) { .two-col { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div class="toast-container" id="toast-container" role="status" aria-live="polite"></div>

  <header class="app-header">
    <div class="app-logo">nova<span>pay</span></div>
    <div class="header-actions">
      <button class="icon-btn" aria-label="Notifications">🔔</button>
      <button class="icon-btn" aria-label="Settings">⚙️</button>
      <div class="avatar" aria-label="Alex Chen">AC</div>
    </div>
  </header>

  <main class="main">
    <div class="balance-hero">
      <div class="balance-eyebrow">Current Balance</div>
      <div class="balance-amount" id="balance-display">£1,250.00</div>
      <div class="balance-footer">
        <div class="account-name">Alex Chen · Current Account</div>
        <div class="account-pill">•••• 4821</div>
      </div>
    </div>

    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">Money In</div>
        <div class="stat-value income" id="money-in">+£0.00</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Money Out</div>
        <div class="stat-value outgo" id="money-out">−£0.00</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Recent Transactions</div>
      <div id="tx-list"></div>
    </div>

    <div class="card">
      <div class="card-title">Withdraw Funds</div>
      <div class="field">
        <label class="field-label" for="withdraw-amount">Amount</label>
        <div class="input-wrap">
          <span class="input-prefix">£</span>
          <input type="text" id="withdraw-amount" inputmode="decimal" placeholder="0.00">
        </div>
      </div>
      <button class="btn" type="button" id="withdraw-btn">Withdraw</button>
    </div>

    <div class="card">
      <div class="card-title">Interest Calculator</div>
      <p style="font-size:0.85em;color:var(--muted);margin-bottom:16px;">Find out how much your savings could earn over 12 months.</p>
      <div class="two-col">
        <div class="field">
          <label class="field-label" for="int-amount">Amount</label>
          <div class="input-wrap">
            <span class="input-prefix">£</span>
            <input type="number" id="int-amount" placeholder="1000">
          </div>
        </div>
        <div class="field">
          <label class="field-label" for="int-rate">Interest Rate</label>
          <div class="input-wrap">
            <span class="input-prefix">%</span>
            <input type="number" id="int-rate" placeholder="4.5">
          </div>
        </div>
      </div>
      <button class="btn btn-ghost" type="button" id="calc-btn">Calculate</button>
      <div class="result-box" id="int-result-box">
        <div class="result-eyebrow">Interest earned over 12 months</div>
        <div class="result-figure" id="int-result-figure"></div>
      </div>
    </div>
  </main>

  <script>
    let balance = 1250;

    // Positive amount = money in, negative = money out. Newest first.
    const transactions = [
      { icon: "☕", name: "Costa Coffee",      date: "Today, 09:14", amount: -3.80 },
      { icon: "💷", name: "Salary — Acme Ltd", date: "1 Jul, 08:00", amount: 2450.00 },
      { icon: "🛒", name: "Tesco Express",     date: "30 Jun, 18:32", amount: -14.30 },
      { icon: "🎵", name: "Spotify",           date: "28 Jun, 00:00", amount: -9.99 },
      { icon: "📦", name: "Amazon",            date: "27 Jun, 14:21", amount: -28.99 }
    ];

    function formatMoney(value) {
      return "£" + value.toLocaleString("en-GB", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function renderTransactions() {
      const list = document.getElementById("tx-list");
      list.innerHTML = "";
      transactions.forEach(function (tx) {
        const isOut = tx.amount < 0;
        const item = document.createElement("div");
        item.className = "tx-item";

        const icon = document.createElement("div");
        icon.className = "tx-icon";
        icon.textContent = tx.icon;

        const meta = document.createElement("div");
        meta.className = "tx-meta";
        const name = document.createElement("div");
        name.className = "tx-name";
        name.textContent = tx.name;
        const date = document.createElement("div");
        date.className = "tx-date";
        date.textContent = tx.date;
        meta.appendChild(name);
        meta.appendChild(date);

        const amt = document.createElement("div");
        amt.className = "tx-amount " + (isOut ? "debit" : "credit");
        amt.textContent = (isOut ? "\u2212" : "+") + formatMoney(Math.abs(tx.amount));

        item.appendChild(icon);
        item.appendChild(meta);
        item.appendChild(amt);
        list.appendChild(item);
      });
    }

    function updateSummary() {
      let moneyIn = 0, moneyOut = 0;
      transactions.forEach(function (tx) {
        if (tx.amount >= 0) moneyIn += tx.amount;
        else moneyOut += Math.abs(tx.amount);
      });
      document.getElementById("money-in").textContent  = "+" + formatMoney(moneyIn);
      document.getElementById("money-out").textContent = "\u2212" + formatMoney(moneyOut);
    }

    function updateBalance() {
      document.getElementById("balance-display").textContent = formatMoney(balance);
    }

    function refreshDashboard() {
      updateBalance();
      renderTransactions();
      updateSummary();
    }

    function showToast(message, type) {
      const container = document.getElementById("toast-container");
      const toast = document.createElement("div");
      toast.className = "toast" + (type === "error" ? " error" : "");
      const icon = document.createElement("span");
      icon.className = "toast-icon";
      icon.setAttribute("aria-hidden", "true");
      icon.textContent = type === "error" ? "⚠️" : "✅";
      const text = document.createElement("span");
      text.textContent = message;
      toast.appendChild(icon);
      toast.appendChild(text);
      container.appendChild(toast);
      requestAnimationFrame(function () { toast.classList.add("show"); });
      setTimeout(function () {
        toast.classList.remove("show");
        setTimeout(function () { toast.remove(); }, 300);
      }, 4000);
    }

    function makeWithdrawal() {
      const input = document.getElementById("withdraw-amount");
      const raw = input.value.replace(/[£,\s]/g, "");
      const amount = parseFloat(raw);

      if (!raw || isNaN(amount) || amount <= 0) {
        showToast("Error: please enter a valid amount greater than £0.00.", "error");
        return;
      }
      if (amount > balance) {
        showToast("Error: insufficient funds. Your balance is " + formatMoney(balance) + ".", "error");
        return;
      }

      const rounded = Math.round(amount * 100) / 100;
      balance = Math.round((balance - rounded) * 100) / 100;

      transactions.unshift({
        icon: "🏧",
        name: "Cash Withdrawal",
        date: "Today, " + new Date().toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" }),
        amount: -rounded
      });

      refreshDashboard();
      input.value = "";
      showToast("Withdrawn " + formatMoney(rounded) + ". New balance: " + formatMoney(balance), "success");
    }

    function calculateInterest() {
      const principal = parseFloat(document.getElementById("int-amount").value);
      const rate = parseFloat(document.getElementById("int-rate").value);
      if (isNaN(principal) || isNaN(rate)) {
        showToast("Error: please enter both an amount and an interest rate.", "error");
        return;
      }
      const interest = principal * (rate / 100); // 12 months = 1 year of simple interest
      document.getElementById("int-result-box").style.display = "block";
      document.getElementById("int-result-figure").textContent = formatMoney(interest);
    }

    document.getElementById("withdraw-btn").addEventListener("click", makeWithdrawal);
    document.getElementById("withdraw-amount").addEventListener("keydown", function (e) {
      if (e.key === "Enter") makeWithdrawal();
    });
    document.getElementById("calc-btn").addEventListener("click", calculateInterest);

    refreshDashboard();
  </script>
</body>
</html>
